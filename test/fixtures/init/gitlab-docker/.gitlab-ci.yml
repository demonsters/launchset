# CI for the shop API.
stages:
  - build
  - deploy

variables:
  IMAGE: $CI_REGISTRY_IMAGE

include:
  - local: ci/publish.yml
  - ci/release.yml

# Docker-in-Docker, shared by the image jobs.
.docker:
  image: docker:29
  services:
    - docker:29-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

test:
  stage: build
  image: node:24
  script:
    - npm ci
    - npm test

# Every push to main moves latest.
build-main:
  extends: .docker
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker build -t $IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
    - docker tag $IMAGE:$CI_COMMIT_SHORT_SHA $IMAGE:latest
    - docker push $IMAGE:latest

# Release images from v* tags.
release-image:
  extends: .docker
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - docker build -t $IMAGE:$CI_COMMIT_TAG .
    - docker push $IMAGE:$CI_COMMIT_TAG
