# Helm chart for the example app.
apiVersion: v2
name: example
description: A Helm chart for the example app   # shown in `helm search`
type: application

# The chart version, bumped when the chart itself changes (not stamped).
version: 0.3.1

# The version of the application being deployed.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
appVersion: "1.4.0"   # stamped by launchset

dependencies:
  - name: postgresql
    version: 15.2.0
    repository: https://charts.bitnami.com/bitnami
