
# --- @@target@@ (ios): example steps, uncomment and adapt ---
.launchset-@@target@@:
  # A macOS runner. These are GitLab's hosted macOS runners (GitLab.com, Premium and Ultimate):
  # the tag picks the machine (saas-macos-medium-m1 or saas-macos-large-m2pro) and the image the
  # macOS and Xcode version (https://docs.gitlab.com/ci/runners/hosted_runners/macos/). On your
  # own macOS runner, use its tags and drop the image. launchset needs Node 24 or later there:
  # check the image's preinstalled software, else install it first (brew install node@24).
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  @@verify_variables@@
  script:
    # Remove this line once you've added the build and upload steps below: it stops the release
    # from marking @@target@@ as shipped while nothing builds it.
    - echo "No build steps for @@target@@ yet. Add them to .gitlab/launchset-targets.yml and remove this line."; exit 1
    # `stamp` already wrote the marketing version (plain X.Y.Z) and the build number into the
    # Xcode project. LAUNCHSET_CHANNEL picks where the build goes: release -> TestFlight, ready
    # to submit for App Store review; prerelease -> an external TestFlight group; preview ->
    # internal testers only. Code signing: see "Code signing iOS Projects with fastlane" in the
    # GitLab docs (the runner's keychain isn't usable as is).
    #
    # - xcodebuild archive -project "@@xcodeproj@@" -scheme "@@scheme@@" -configuration Release -destination "generic/platform=iOS" -archivePath "build/@@scheme@@.xcarchive"
    # - xcodebuild -exportArchive -archivePath "build/@@scheme@@.xcarchive" -exportOptionsPlist ExportOptions.plist -exportPath build/export
    # Upload with a fastlane lane (see "Workflow recipes" in the launchset docs):
    #   lane :testflight do |options|
    #     api_key = app_store_connect_api_key(key_id: ENV.fetch("ASC_KEY_ID"),
    #       issuer_id: ENV.fetch("ASC_ISSUER_ID"), key_content: ENV.fetch("ASC_PRIVATE_KEY"))
    #     upload_to_testflight(api_key: api_key, ipa: options.fetch(:ipa),
    #       skip_waiting_for_build_processing: true)
    #   end
    # - export ASC_KEY_ID="$LAUNCHSET_ASC_KEY_ID" ASC_ISSUER_ID="$LAUNCHSET_ASC_ISSUER_ID" ASC_PRIVATE_KEY="$LAUNCHSET_ASC_PRIVATE_KEY"
    # - bundle exec fastlane testflight ipa:"build/export/@@scheme@@.ipa"
