
# --- @@target@@ (web): your build and deploy steps ---
.launchset-@@target@@:
  image: node:24
  script:
    # Remove this line once you've added the build and deploy steps below: it stops the release
    # from marking @@target@@ as shipped while nothing builds it.
    - echo "No build steps for @@target@@ yet. Add them to .gitlab/launchset-targets.yml and remove this line."; exit 1
    # The root package.json already has the version. `stamp` also wrote it into any extra `files`
    # of this target. For example:
    # - npm ci
    # - npm run build
    # - ./scripts/deploy-web.sh   # your own deploy
