
# Preview builds: test builds from an MR, a preview branch or a prerelease branch. Nothing is
# committed, no changesets are consumed and no marker or release tags are created. (Prerelease
# branches also get a git tag and a GitLab release.)
#
# Adding a label to an MR doesn't start a pipeline on GitLab. In MR pipelines the preview
# therefore runs:
@@preview_mr_help@@
# Fork MRs never get a preview: their pipelines have no access to this project's variables.
# The plan and trigger jobs share these conditions; only `when` differs.
#
# The result (one sticky MR note per preview, or the GitLab release of a prerelease) comes from
# the job launchset-preview-comment at the end of the child pipeline, so it also runs for a
# preview someone started from the manual job.

launchset-preview-plan:
  extends: .launchset-cli
  rules:
    @@preview_plan_rules@@
  # A newer push replaces the preview. Prerelease builds are never cancelled once they started
  # (the child pipeline's jobs are not interruptible then).
  interruptible: true
  script:
    # Decides the version, build number and targets (and reserves the tag on a prerelease
    # branch). Writes plan.json (not when the preview is skipped) and launchset-child.yml.
    - launchset preview-plan --ci
  artifacts:
    paths:
      - plan.json
      - launchset-child.yml
    expire_in: 30 days

launchset-preview:
  stage: @@stage@@
  needs: [launchset-preview-plan]
  rules:
    @@preview_trigger_rules@@
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  trigger:
    include:
      - artifact: launchset-child.yml
        job: launchset-preview-plan
    strategy: mirror

# Opt-in: start a preview when the label is added, without a push or a click. GitLab starts no
# pipeline for a label, so a pipeline schedule runs this job (Build > Pipeline schedules: the
# default branch, the variable LAUNCHSET_PREVIEW_SWEEP=true, for example every 10 minutes). It
# starts an MR pipeline for each open MR whose label was added after its last MR pipeline for
# the head commit: at most 10 per run, oldest label first. Without that schedule it never runs.
@@preview_sweep_help@@
launchset-preview-sweep:
  extends: .launchset-cli
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $LAUNCHSET_PREVIEW_SWEEP == "true"
  variables:
    # It reads only the config and the API: no history needed.
    GIT_DEPTH: "1"
  # The next scheduled run does the same work.
  interruptible: true
  script:
    - launchset preview-sweep
