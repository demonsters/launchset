# Generated by launchset init. Safe to edit: launchset never rewrites this file.
#
# launchset's GitLab CI jobs. Your .gitlab-ci.yml includes this file:
#
#   include:
#     - local: .gitlab/launchset.yml
#
#   launchset-check            MR pipelines: every MR needs a changeset (or `bump: none`), unless
#                              it comes from a bot or is the release MR. One sticky MR note.
#   launchset-release          pushes to the base branch (or a maintenance branch): updates the
#                              release MR or, when the release MR was just merged, plans the
#                              release and writes the child pipeline launchset-child.yml
#   launchset-build            runs launchset-child.yml: one build-<target> job per target
#                              (stamp -> verify -> YOUR build and upload steps -> mark), then
#                              launchset-finalize (release tag and GitLab release)
@@preview_overview@@
#
# Your build and upload steps live in .gitlab/launchset-targets.yml (one hidden job per target).
# The child pipeline only contains the jobs a plan needs: nothing to build, no build jobs.
#
# Requirements:
#   - GitLab 18.2 or later (trigger:strategy:mirror).
#   - Merge request pipelines (see the workflow: rules launchset init writes into .gitlab-ci.yml).
#   - The CI/CD variable LAUNCHSET_TOKEN: a project or group access token with the api and
#     write_repository scopes and the Maintainer role, masked. Pushes made with CI_JOB_TOKEN never
#     start pipelines, so the release MR would get none. If you mark it Protected, only pipelines
#     of protected branches get it: MR checks then can't post their note, and MR previews can't
#     comment.
#     Fork MR pipelines that run in the fork have none of this project's variables, so
#     launchset-check can't post its note there and skips them (run the MR's pipeline in this
#     project, from the MR's Pipelines tab, to check it).
#   - Runners for the node:24 image. launchset needs Node 24 or later, npm and git.
#
# Starting a pipeline by hand (Build > Pipelines > Run pipeline), with pipeline variables:
#   - On the base branch or a maintenance branch, without variables: retries an unfinished
#     release of the current version (for example when its pipeline was cancelled or failed).
#   - LAUNCHSET_TARGET=<name>: ships a manual target (for example an iOS app that is not built on
#     every release). LAUNCHSET_RELEASE_VERSION=<version> picks the released version (default:
#     the latest release on this branch); LAUNCHSET_FORCE=true ships it even if the target
#     already shipped a higher version. LAUNCHSET_ATTEMPT=<1-99> sets the last two digits of a
#     "semver" build number (default 1), to upload the same version again.
@@preview_manual_help@@
#   GitLab may restrict pipeline variables by role: Settings > CI/CD > Variables, "Minimum role
#   to use pipeline variables" (default Maintainer on self-managed; no_one_allowed for new
#   projects on GitLab.com, which blocks the runs above until you change it).

# The launchset CLI for every launchset job.
.launchset-cli:
  # Node 24 or later with npm (node:24 is Debian, with git). launchset installs into it with npm.
  image: node:24
  stage: @@stage@@
  variables:
    # Full history and tags: launchset compares with the last release and pushes tags.
    GIT_DEPTH: "0"
    # The launchset package to install. A CI/CD variable of the same name overrides it.
    LAUNCHSET_CLI: @@cli_spec@@
  # No cache: launchset needs none, and files a `default: cache` restores into the checkout
  # would count as uncommitted changes when launchset builds the release branch.
  cache: []
  before_script:
    @@install@@

# The pipelines that release: pushes, and Run pipeline (web) or the API on the base branch and the
# maintenance branches. Not a manual preview (LAUNCHSET_PREVIEW=true).
.launchset-release-rules:
  rules:
    - if: $LAUNCHSET_PREVIEW == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE != "push" && $CI_PIPELINE_SOURCE != "web" && $CI_PIPELINE_SOURCE != "api"
      when: never
    @@release_branch_rules@@

launchset-check:
  extends: .launchset-cli
  # A newer push to the MR makes this run redundant.
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    # Not in a fork MR's pipeline that runs in the fork: it has no LAUNCHSET_TOKEN.
    - if: $CI_PROJECT_ID != $CI_MERGE_REQUEST_PROJECT_ID
      when: never
    # MRs into the base branch, the maintenance branches (hotfixes) and the prerelease branches.
    @@check_rules@@
  script:
    - launchset check

launchset-release:
  extends: .launchset-cli
  rules: !reference [.launchset-release-rules, rules]
  # One release job per branch at a time, so release MR updates happen one after the other.
  # GitLab keeps every job that waits for a resource group (it never drops one), so the pipeline
  # of the release commit always gets its publish run. (The order isn't guaranteed: a job for an
  # older commit may run after a newer one; launchset then leaves the release MR to the newest.)
  resource_group: launchset-release-$CI_COMMIT_REF_SLUG
  # Never cancelled once it started. The release commit's push is the only run that publishes
  # it (pushes don't retry a release), but GitLab's "Auto-cancel redundant pipelines" can still
  # cancel its pipeline while this job waits, when another push follows quickly. The
  # `workflow: auto_cancel: on_new_commit: interruptible` that launchset init writes into
  # .gitlab-ci.yml prevents that. If it happened anyway: Run pipeline on the branch without
  # variables retries the unfinished release.
  interruptible: false
  # No artifacts from jobs of earlier stages: in the checkout they would count as uncommitted
  # changes when launchset builds the release branch.
  dependencies: []
  script:
    # Writes plan.json, launchset.env (below), launchset.sh and launchset-child.yml, the child
    # pipeline for the plan (printed to this log too).
    - launchset release --ci
  artifacts:
    paths:
      - plan.json
      - launchset-child.yml
    reports:
      # LAUNCHSET_MODE, LAUNCHSET_VERSION, LAUNCHSET_TAG, ... for later jobs that need this one.
      dotenv: launchset.env
    # Long enough to retry a failed build job of the child pipeline: it reads plan.json from here.
    expire_in: 30 days

launchset-build:
  stage: @@stage@@
  needs: [launchset-release]
  rules: !reference [.launchset-release-rules, rules]
  variables:
    # The child jobs read plan.json from launchset-release in this pipeline.
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  trigger:
    include:
      - artifact: launchset-child.yml
        job: launchset-release
    # This job (and so this pipeline and the MR) gets the child pipeline's status.
    strategy: mirror
@@preview_jobs@@
