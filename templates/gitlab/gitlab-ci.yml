# Generated by launchset init. Safe to edit: launchset never rewrites this file.
#
# The project's CI configuration. launchset's jobs come from .gitlab/launchset.yml (included
# below) and your build steps per target from .gitlab/launchset-targets.yml. Add your own jobs
# (tests, linting) here.
@@sweep_note@@

workflow:
  # On a new commit, cancel only jobs marked `interruptible: true` (checks, previews). launchset's
  # release jobs are not, so the pipeline of a release commit is never cancelled before it
  # published (the default "conservative" mode could cancel it while its release job waits).
  auto_cancel:
    on_new_commit: interruptible
  # Merge request pipelines for branches with an open MR, branch pipelines otherwise, so a push
  # never runs two pipelines. Run pipeline (web) and API pipelines always run.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    @@always_branch_rules@@
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH

@@include@@
