# Generated by launchset init. Safe to edit: launchset never rewrites this file.
#
# Preview builds: test builds from a labeled PR, a branch or a prerelease branch. Nothing is
# committed, no changesets are consumed and no marker or release tags are created. (Prerelease
# branches also get a git tag and a GitHub pre-release.)
#
#   plan     decides the version, build number and targets
#   build    one job per target: stamp -> YOUR build and upload steps, to internal channels
#   comment  one sticky PR comment with the result per target
#
# Add your own build and upload steps in the `build` job, where the comments say so.
name: Launchset preview

on:
  pull_request:
    types: @@pr_types@@
@@push_trigger@@
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated target names to build. Default: the preview targets from the launchset
          config.
        required: false
        type: string

# One preview per PR or branch; a newer push replaces the older preview.
# Runs that are not a preview (a PR without the preview label, fork PRs) get a group of their
# own, so they can never cancel a preview that is building.
#
# Prerelease branches must build every push, so they never cancel. GitHub expressions have no
# glob matching, so the prerelease globs from the config are turned into startsWith/endsWith
# checks. That is an approximation: a branch that only looks like a prerelease branch is not
# cancelled either. That is the safe direction. Edit the expression if you change the globs.
concurrency:
  group: launchset-preview-${{ (github.event_name != 'pull_request' || @@pr_relevant@@) && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: @@cancel_in_progress@@

permissions:
  contents: read

jobs:
  # Fork PRs get no secrets (no GitHub App token), so they can't be previewed.
  fork-notice:
    name: Preview skipped for fork PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && @@pr_label@@
    runs-on: ubuntu-latest
    steps:
      - name: Explain in the job summary
        run: |
          {
            echo "### Launchset preview skipped"
            echo
            echo "This pull request comes from a fork. GitHub does not give secrets to workflows"
            echo "started by fork PRs, so launchset cannot mint its GitHub App token or upload"
            echo "builds. A maintainer can push the branch to this repository to get a preview."
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Plan preview
    # Pull requests: only same-repo PRs with the preview label. A `labeled` event for any
    # other label is ignored. Pushes and manual runs always plan.
    if: github.event_name != 'pull_request' || @@pr_relevant@@
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
      version: ${{ steps.plan.outputs.version }}
      build-number: ${{ steps.plan.outputs.build-number }}
      channel: ${{ steps.plan.outputs.channel }}
      release-sha: ${{ steps.plan.outputs.release-sha }}
    steps:
      # The App token is needed to push the reservation tag on prerelease branches.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LAUNCHSET_APP_ID }}
          private-key: ${{ secrets.LAUNCHSET_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - id: plan
        uses: @@action@@
        with:
          command: preview-plan
          token: ${{ steps.app-token.outputs.token }}
          # Only set by workflow_dispatch: restricts the preview to these targets.
          target: ${{ inputs.targets }}

  build:
    name: Preview ${{ matrix.target }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '[]'
    runs-on: @@runs_on@@
    permissions:
      @@build_permissions@@
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.release-sha || github.sha }}
      @@login_steps@@

      # Writes the preview version and build number into this target's files (this checkout only).
      - id: stamp
        uses: @@action@@
        with:
          command: stamp
          target: ${{ matrix.target }}
          plan: ${{ needs.plan.outputs.plan }}

      # ---------------------------------------------------------------------------------------
      # Your build and upload steps go here, one group per target, with
      #   if: matrix.target == '<name>'
      # Upload to internal channels only (TestFlight internal testing, the Play internal track,
      # preview Docker tags). `steps.stamp.outputs.channel` is `preview`, or `prerelease` on a
      # prerelease branch.
      # ---------------------------------------------------------------------------------------
      @@build_steps@@
      # ---------------------------------------------------------------------------------------

  comment:
    name: Preview comment
    needs: [plan, build]
    # Also when a build failed: the comment shows which target failed. Not when the plan was
    # skipped (no preview label, fork PR).
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read # lists the jobs of this run, for the per-target links
      contents: read
      pull-requests: write
    steps:
      # On prerelease branches this job also creates the GitHub pre-release, which needs the App.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LAUNCHSET_APP_ID }}
          private-key: ${{ secrets.LAUNCHSET_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - uses: @@action@@
        with:
          command: preview-comment
          token: ${{ steps.app-token.outputs.token }}
          plan: ${{ needs.plan.outputs.plan }}
        env:
          # The default token (actions: read) reads the job results; the App token writes.
          GITHUB_TOKEN: ${{ github.token }}
