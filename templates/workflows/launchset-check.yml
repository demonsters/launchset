# Generated by launchset init. Safe to edit: launchset never rewrites this file.
#
# The PR check: every PR needs a changeset (or `bump: none`), unless it comes from a bot or is
# the release PR. It keeps one sticky comment on the PR. See the launchset docs, "PR check".
name: Launchset check

on:
  pull_request:
    # `edited` and the label events matter: they re-run the check when the PR description or
    # labels change.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    # The base branch, the maintenance branches (hotfixes) and the prerelease branches.
    branches:
      @@branches@@

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Changeset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check compares against the base branch and the last release tag.
          fetch-depth: 0
      - uses: @@action@@
        with:
          command: check
          # The check only reads and comments, so the default token is enough.
          token: ${{ secrets.GITHUB_TOKEN }}
