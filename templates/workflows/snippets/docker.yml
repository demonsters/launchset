# --- @@target@@ (docker) ---
- name: Set up Docker Buildx (@@target@@)
  if: @@if@@
  uses: docker/setup-buildx-action@v4
- name: Build and push @@target@@
  if: @@if@@
  uses: docker/build-push-action@v7
  with:
    context: @@context@@
    @@file_line@@
    @@platforms_line@@
    push: true
    # The tags and labels come from launchset and follow the `tags` config of this target.
    tags: ${{ steps.stamp.outputs.docker-tags }}
    labels: ${{ steps.stamp.outputs.docker-labels }}
    cache-from: type=gha,scope=@@target@@
    cache-to: type=gha,mode=max,scope=@@target@@
