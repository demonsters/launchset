# --- @@target@@ (web): your build and deploy steps, e.g. ---
# Remove this step once you've added the build and upload steps below: it stops the release
# from marking @@target@@ as shipped while nothing builds it.
- name: Build steps missing (@@target@@)
  if: @@if@@
  run: |
    echo "::error::No build steps for @@target@@ yet. Add them to this workflow and remove this step."
    exit 1
