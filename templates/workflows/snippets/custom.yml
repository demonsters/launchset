# --- @@target@@ (custom): your build and publish steps go here ---
# Remove this step once you've added the build and upload steps below: it stops the release
# from marking @@target@@ as shipped while nothing builds it.
- name: Build steps missing (@@target@@)
  if: @@if@@
  run: |
    echo "::error::No build steps for @@target@@ yet. Add them to this workflow and remove this step."
    exit 1
# `stamp` wrote the version into this target's `files`, if it has any. Example, for an npm
# package (and add `verify: ["npm"]` to the target to skip it when the version exists):
#
# - uses: actions/setup-node@v5
#   if: @@if@@
#   with:
#     node-version: 24
#     registry-url: https://registry.npmjs.org
# - run: npm publish --tag ${{ steps.stamp.outputs.dist-tag }}
#   if: @@if@@
#   env:
#     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
